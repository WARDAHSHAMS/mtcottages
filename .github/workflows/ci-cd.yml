name: CI / GitHub Pages CD

on:
  pull_request:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mtcottages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Astro toolchain
        run: npm ci

      - name: Type-check and build Astro site
        run: npm run check && npm run build

      - name: Validate source files and public boundaries
        run: |
          git diff --check
          for json_file in infra/azure/*.json; do jq empty "$json_file"; done
          python3 -m py_compile scripts/check-form-parity.py infra/azure/apply-proxy/function_app.py
          # Shared with the GitLab merge-request pipeline (.gitlab-ci.yml).
          node scripts/check-dist.mjs dist

      - name: Run proxy unit tests
        run: |
          if [ -d infra/azure/apply-proxy/tests ]; then
            python3 -m pip install --disable-pip-version-check --no-input --quiet "pytest>=8,<9"
            python3 -m pytest -q infra/azure/apply-proxy/tests
          else
            echo "No proxy tests found; skipping."
          fi

      - name: Guard against committed street addresses
        run: |
          # Broader backstop for the *.html-only check above: scan every
          # tracked file for the banned addresses and the general
          # house-number+street pattern, so a leak into _data/*.json,
          # scripts/, or any other file fails the build too. Docs/tests
          # that describe or assert the rule (and legitimately name the
          # banned strings) are excluded. Frederick is not in the list: the
          # owner approved publishing 125 Frederick St (Oct 2026). The owner
          # also approved exactly three more home addresses (200 Henrietta,
          # 2712 Broad, 3113 Broad); every other house number stays banned.
          bash scripts/check-addresses.sh

      - name: Check application form parity
        run: |
          python3 -m py_compile scripts/check-form-parity.py
          python3 scripts/check-form-parity.py

  e2e-local:
    name: Local browser E2E
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build Astro site
        working-directory: .
        run: npm ci && npm run check && npm run build

      - name: Start the local Astro site
        run: |
          nohup python3 -m http.server 4173 --directory dist --bind 127.0.0.1 >/tmp/mtcottages-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mtcottages-http.log
          exit 1

      - name: Run local browser tests
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm test

      - name: Upload local Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mtcottages-local-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  publish-pages:
    name: Publish Astro site to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
    needs: e2e-local
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Build the verified Astro artifact
        run: npm ci && npm run check && npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Astro artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  live-smoke:
    name: Live smoke after gh-pages publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/gh-pages'
    needs: publish-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Verify the published marketing site
        working-directory: e2e
        env:
          BASE_URL: https://mtcottages.com
        run: npm test

      - name: Lighthouse gate on the four home microsites
        working-directory: e2e
        env:
          BASE_URL: https://mtcottages.com
        run: npm run perf

      - name: Verify the published stay application edge
        working-directory: e2e
        env:
          BASE_URL: https://stay.mtcottages.com
        run: npx playwright test tests/live.spec.js

      - name: Upload live Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mtcottages-live-playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
