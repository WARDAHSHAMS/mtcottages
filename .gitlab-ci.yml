# mtcottages — gh-pages mirror to GitHub
#
# gh-pages is the published branch: GitHub Pages (via GitHub Actions,
# .github/workflows/ci-cd.yml) serves it directly. This pipeline's only
# job is to push gh-pages to the GitHub mirror so that workflow can run.
#
# The full launch-sequence pipeline (lint/preflight + GitLab Pages deploy)
# lives on the demo branch instead — gh-pages only needs the mirror job,
# so we include just that job file rather than the whole static-site
# pipeline.
#
# main (the default branch) and merge requests get one light validation job,
# `validate`, so the default branch has a pipeline. Without it, every job in
# this file is gated on `$CI_COMMIT_BRANCH == "gh-pages"`, so a push to main
# created zero jobs and therefore no pipeline. validate is read-only: it builds
# nothing, deploys nothing and never runs on gh-pages, so the mirror job above
# is unchanged.
#
# The stay application host (infra/azure/apply-proxy, the Azure Function behind
# stay.mtcottages.com) is published by this pipeline and by nothing else
# (WorldEnterpriseGroup/mtcottages#9). test:apply-proxy and package:apply-proxy
# run on merge requests and on gh-pages; deploy:apply-proxy and
# smoke:apply-proxy run on gh-pages only. See infra/azure/README.md.

include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: 327c2283a8f056624e979c135de1408d465e680c
    file: '/jobs/github-mirror.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: 327c2283a8f056624e979c135de1408d465e680c
    file: '/jobs/preflight.yml'
  # Pinned separately: the two includes above predate this job file.
  - project: 'DroidOpsInc/launch-sequence'
    ref: 9668a18a9ec16f8238fafe14153d510cc9ef5b76
    file: '/jobs/deploy-azure-function.yml'

variables:
  GITHUB_REPO: "WorldEnterpriseGroup/mtcottages"
  # launch-sequence's mirror job fails closed without a GITHUB_TOKEN. This project defines
  # none (the previous template skipped silently), so keep "push nothing" explicit.
  GITHUB_MIRROR_EXTERNAL: "true"
  PREFLIGHT_IMAGE: "harbor.focuscell.org/dockerhub-proxy/alpine/k8s:1.33.1"
  # git: verify:site-live runs on this image and asks git about ancestry.
  PREFLIGHT_REQUIRED_TOOLS: "jq python3 git"
  # The "Before publishing" checks from CLAUDE.md that need no npm install.
  PREFLIGHT_COMMANDS: |
    python3 -I scripts/check-form-parity.py
    jq empty infra/azure/*.json
    bash -n infra/azure/intake-logicapp.sh
    bash -n infra/azure/intake-canary.sh
    bash -n infra/azure/analytics-verify.sh
    bash -n infra/azure/intake-loss-count.sh
    yq -o=json 'explode(.)' .gitlab-ci.yml | python3 -I scripts/check-ci-runner-contract.py
    python3 -m unittest discover -s scripts/tests -p 'test_*.py'
    python3 -I scripts/check-edge-clients.py infra/azure/*.sh
    test -f .nojekyll
    grep -qx 'mtcottages.com' CNAME

stages:
  - preflight
  - mirror
  - package
  - deploy
  - smoke
  - report

mirror:
  extends: .mirror:github

validate:
  extends: .preflight:lint

# Merge requests also get the full site check that GitHub Actions runs after a
# push to gh-pages (static-checks + e2e-local), so a change is proven green
# before it reaches the published branch. Builds run in CI, never locally. The
# image tag matches @playwright/test in e2e/package.json, so its browsers fit.
site-check:
  stage: preflight
  image: "harbor.focuscell.org/mcr-proxy/playwright:v1.62.1-noble"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # A cold build re-encodes ~370 photos and can take most of an hour on its own;
  # later runs reuse the cached images in .cache/astro.
  timeout: 90 minutes
  variables:
    BASE_URL: "http://127.0.0.1:4173"
    # Full history: each sitemap lastmod is its page's last content commit, and the build fails on a shallow clone (#82).
    GIT_DEPTH: "0"
    # The live home page, screenshotted as the "before" next to this build's "after" (e2e/tests/home-page.spec.js).
    HOME_BEFORE_URL: "https://mtcottages.com/"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    - key:
        files: [package-lock.json, e2e/package-lock.json]
      paths: [.npm/]
    # Astro's optimised-image cache (cacheDir in astro.config.mjs). Shared across
    # branches: entries are keyed by source image and options, so stale ones are harmless.
    - key: astro-images
      paths: [.cache/astro/]
      when: always
  script:
    - set -eu
    - node --version
    - git diff --check "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD
    - npm ci --no-audit --no-fund
    - npm run check
    - npm run build
    - node scripts/check-dist.mjs dist
    # Every proximity claim cites a dated measurement; wrong claims stay out (#26).
    - node scripts/check-claims.mjs dist
    # On-page SEO: titles, descriptions, one H1, alt text, no duplicates (#69).
    - node scripts/seo-audit.mjs dist
    # No broken or redirect links, no orphan pages, descriptive anchors, matching breadcrumbs (#35).
    - node scripts/check-links.mjs dist
    # Guide images outside the portfolio need a licence row (#47).
    - node scripts/check-photo-licences.mjs
    # Unit tests for the distances schema and the banned-claim patterns (#25), and per-page sitemap lastmod (#82).
    - node --test scripts/tests/*.test.mjs
    # Same address guard as GitHub Actions: only the four approved addresses.
    - bash scripts/check-addresses.sh
    - npm --prefix e2e ci --no-audit --no-fund
    - nohup npx astro preview --host 127.0.0.1 --port 4173 > astro-preview.log 2>&1 &
    - |
      ready=no
      attempt=0
      while [ "$attempt" -lt 30 ]; do
        if node -e 'fetch(process.argv[1]).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))' "$BASE_URL/index.html"; then
          ready=yes
          break
        fi
        attempt=$((attempt + 1))
        sleep 1
      done
      if [ "$ready" != yes ]; then cat astro-preview.log; exit 1; fi
    # Playwright covers behaviour, privacy and axe (WCAG 2.1 AA) on every public page.
    # Fixed worker count: Playwright's default is half the *node's* CPUs, not the pod's
    # share, so on a large node it ran 9 browsers against one preview server and the first
    # tests of each worker timed out with no assertion failing (!36, pipeline 146096).
    - npm --prefix e2e test -- --workers=4
    # The post-deploy microsite smoke (tests/live.spec.js), against this build: it otherwise first runs
    # after publish, where a failure can only be fixed forward from a red live site.
    - (cd e2e && MARKETING_URL="$BASE_URL" npx playwright test tests/live.spec.js --grep "microsite index loads")
    # Mobile Lighthouse on the home page and every microsite overview and tour (pages come from the sitemap).
    - LH_REPORT="$CI_PROJECT_DIR/lighthouse-scores.json" npm --prefix e2e run perf
    # Structured data (#22): `npm run check` above type-checks every JSON-LD builder against
    # schema-dts (the schema.org vocabulary), and tests/schema.spec.js checks the built pages.
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - e2e/playwright-report/
      - e2e/test-results/
      - astro-preview.log
      - lighthouse-scores.json

# Brand-system options for the CEO's pick (WorldEnterpriseGroup/mtcottages#27).
# Checks every option's contrast, then renders each one on the home page and
# Frederick Cottage (desktop and 390px phone) by injecting its tokens, fonts and
# wordmark in the browser. Nothing here changes the published site. Fonts are
# free (OFL) Fontsource packages, installed outside the repo for this job only.
brand:capture:
  stage: preflight
  image: "harbor.focuscell.org/mcr-proxy/playwright:v1.62.1-noble"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - docs/marketing/brand-options/**/*
          - e2e/brand/**/*
          - scripts/tests/brand-options.test.mjs
  timeout: 90 minutes
  variables:
    BASE_URL: "http://127.0.0.1:4173"
    BRAND_FONT_DIR: "/tmp/brand-fonts"
    BRAND_SHOT_DIR: "$CI_PROJECT_DIR/brand-screenshots"
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    - key:
        files: [package-lock.json, e2e/package-lock.json]
      paths: [.npm/]
      policy: pull
    - key: astro-images
      paths: [.cache/astro/]
      policy: pull
  script:
    - set -eu
    - node --test scripts/tests/brand-options.test.mjs
    - npm ci --no-audit --no-fund
    - npm run build
    - npm --prefix e2e ci --no-audit --no-fund
    - mkdir -p "$BRAND_FONT_DIR" "$BRAND_SHOT_DIR"
    - npm install --no-save --no-audit --no-fund --prefix "$BRAND_FONT_DIR" "@fontsource/source-serif-4@5" "@fontsource/source-sans-3@5" "@fontsource/fraunces@5" "@fontsource/figtree@5" "@fontsource/newsreader@5" "@fontsource/inter@5"
    - npm ls --prefix "$BRAND_FONT_DIR" --depth=0 | tee "$BRAND_SHOT_DIR/font-versions.txt"
    - nohup npx astro preview --host 127.0.0.1 --port 4173 > astro-preview.log 2>&1 &
    - |
      ready=no
      attempt=0
      while [ "$attempt" -lt 30 ]; do
        if node -e 'fetch(process.argv[1]).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))' "$BASE_URL/index.html"; then
          ready=yes
          break
        fi
        attempt=$((attempt + 1))
        sleep 1
      done
      if [ "$ready" != yes ]; then cat astro-preview.log; exit 1; fi
    - cd e2e && npx playwright test --config brand/playwright.config.js
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - brand-screenshots/
      - astro-preview.log

# ---------------------------------------------------------------------------
# Live-build gate (WorldEnterpriseGroup/mtcottages#19)
# ---------------------------------------------------------------------------
# On 2026-11-15 every gh-pages push cancelled the GitHub Pages deploy still in
# progress, so !26 and !32 were merged and mirrored but never published, and
# every pipeline stayed green. The site now serves /build.json with the commit
# it was built from (integrations/build-stamp.mjs). This job fails unless
# mtcottages.com serves this pipeline's commit, or a newer gh-pages commit that
# contains it, within the deadline. A healthy GitHub run takes 30 to 35 minutes
# from push to published (runs 117 and 119), so the deadline is 45 minutes: one
# deploy plus margin. A shorter one (#83 asked for ~20) would be red on every
# healthy merge. When a run is still queued behind another, the newer gh-pages
# pipeline's gate covers the commit, because its deploy contains this one.
# python3 -u streams each poll to the job log instead of buffering to the end.
#
# On main it fails at once when main has a commit gh-pages lacks: main never
# deploys, so that work cannot go live until it is merged into gh-pages. The
# scheduled pipelines on both branches re-check, which catches a deploy that
# stalls with no new push. Read-only: it only GETs the public site and fetches
# from this project.
verify:site-live:
  stage: smoke
  image: ${PREFLIGHT_IMAGE}
  needs: []
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(gh-pages|main)$/ && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web)$/'
  timeout: 55 minutes
  script:
    - python3 -I -u scripts/check-live-build.py --expect "$CI_COMMIT_SHA" --deploy-ref gh-pages --timeout 2700 --interval 60

# ---------------------------------------------------------------------------
# Stay application host (infra/azure/apply-proxy)
# ---------------------------------------------------------------------------

# When the apply-proxy jobs run. A pipeline started by hand ("Run pipeline" on
# gh-pages) has no push to compare against, so `changes` is true and the current
# commit is published again.
.apply-proxy:paths: &apply_proxy_paths
  - infra/azure/apply-proxy/**/*
  - e2e/tests/synthetic-inquiry.spec.js
  # verify:analytics proves each deploy, so a change to it re-runs the chain.
  - infra/azure/analytics-verify.sh
  - .gitlab-ci.yml

# A scheduled pipeline (the #13 drift gate, the #16 canary) has no push either,
# so `changes` would be true there too and every schedule would rebuild and
# redeploy the proxy. Schedules check; they never publish. The same holds for a
# hand-run intake check (#12 count, #13 drift, #16/#84 canary from "Run pipeline"
# or `glab ci run`): it reads Azure and must not republish the proxy.
.apply-proxy:verify-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($INTAKE_LOSS_COUNT == "true" || $INTAKE_LOGICAPP_DRIFT == "true" || $INTAKE_CANARY_ENABLED == "true")'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *apply_proxy_paths
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
      changes: *apply_proxy_paths

# APPLY_PROXY_DEPLOY_ENABLED is a switch, not a credential. It stays unset until
# the deploy identity, its ExternalSecret and the scoped runner mount exist
# (infra/azure/README.md, "Prerequisites"). With it unset the deploy and smoke
# jobs are not created, so a pipeline never waits on a runner that is not there.
.apply-proxy:deploy-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($INTAKE_LOSS_COUNT == "true" || $INTAKE_LOGICAPP_DRIFT == "true" || $INTAKE_CANARY_ENABLED == "true")'
      when: never
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $APPLY_PROXY_DEPLOY_ENABLED == "true"'
      changes: *apply_proxy_paths
    - when: never

test:apply-proxy:
  extends: .apply-proxy:verify-rules
  stage: preflight
  interruptible: true
  # renovate: datasource=docker depName=python
  image: "harbor.focuscell.org/dockerhub-proxy/library/python:3.14-slim"
  script:
    - python3 -m pip install --disable-pip-version-check --no-input --quiet "pytest>=8,<9"
    - python3 -m py_compile infra/azure/apply-proxy/function_app.py infra/azure/apply-proxy/intake_notify.py infra/azure/apply-proxy/deep_health.py infra/azure/apply-proxy/managed_identity.py infra/azure/apply-proxy/analytics.py infra/azure/apply-proxy/intake_outcomes.py infra/azure/apply-proxy/ci/synthetic_host.py
    - python3 -m pytest -q infra/azure/apply-proxy/tests

# The intake gate (#85): every real guest inquiry got HTTP 400 for weeks and
# no check noticed. This job submits the real form like a guest, in Chromium,
# against the packaged Function code itself (ci/synthetic_host.py runs the same
# HTTP functions the Azure host calls). Turnstile runs the real widget and the
# real verify code against Cloudflare's live siteverify, with Cloudflare's
# published always-pass test keys; these are public test values, not secrets.
# The Logic App is a stub on the same host, so nothing reaches Dynamics 365 or
# a guest. Any non-2xx from /api/apply fails the job, and deploy:apply-proxy
# needs it, so a proxy that refuses real inquiries is never published.
# The Playwright image's python3 has no pip and the job runs without root, so
# the Function's dependencies are installed here, for that interpreter's
# version, and handed over as an artifact.
synthetic:deps:
  extends: .apply-proxy:verify-rules
  stage: preflight
  interruptible: true
  # renovate: datasource=docker depName=python
  image: "harbor.focuscell.org/dockerhub-proxy/library/python:3.14-slim"
  variables:
    # python3 in the Playwright noble image; synthetic:inquiry fails loudly if it changes.
    SYNTHETIC_PYTHON_VERSION: "3.12"
  script:
    - >-
      python3 -m pip install --disable-pip-version-check --no-input --quiet
      --target synthetic-deps --python-version "$SYNTHETIC_PYTHON_VERSION" --only-binary=:all:
      -r infra/azure/apply-proxy/requirements.txt
  artifacts:
    expire_in: 1 day
    paths:
      - synthetic-deps/

synthetic:inquiry:
  extends: .apply-proxy:verify-rules
  stage: preflight
  interruptible: true
  # renovate: datasource=docker depName=playwright registryUrl=https://mcr.microsoft.com
  image: "harbor.focuscell.org/mcr-proxy/playwright:v1.62.1-noble"
  timeout: 20m
  needs:
    - job: synthetic:deps
      artifacts: true
  variables:
    SYNTHETIC_HOST_URL: "http://127.0.0.1:7071"
    TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
    TURNSTILE_ACCEPT_TEST_KEYS: "true"
    # Cloudflare answers every test-key token with this hostname.
    TURNSTILE_ALLOWED_HOSTNAMES: "example.com"
    LOGICAPP_URL_APPLICATION: "http://127.0.0.1:7071/__intake/trigger"
    # The staff alert (#93): the real Graph transport, against the host's stub
    # identity, login and Graph endpoints. Placeholder ids, no secret, no mail sent.
    STAFF_ALERT_RECIPIENTS: "synthetic-staff@example.invalid"
    GRAPH_MAIL_TENANT_ID: "00000000-0000-4000-8000-000000000093"
    GRAPH_MAIL_CLIENT_ID: "00000000-0000-4000-8000-000000000094"
    GRAPH_MAIL_SENDER: "synthetic-sender@example.invalid"
    GRAPH_MAIL_LOGIN_ENDPOINT: "http://127.0.0.1:7071/__login"
    GRAPH_MAIL_API_ENDPOINT: "http://127.0.0.1:7071/__graph"
    IDENTITY_ENDPOINT: "http://127.0.0.1:7071/__identity/token"
    IDENTITY_HEADER: "synthetic-identity-header"
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - set -eu
    - |
      actual="$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
      if [ "$actual" != "3.12" ]; then
        echo "python3 here is $actual; set SYNTHETIC_PYTHON_VERSION in synthetic:deps to match" >&2
        exit 1
      fi
    - nohup python3 -I infra/azure/apply-proxy/ci/synthetic_host.py --port 7071 --deps-dir synthetic-deps > synthetic-host.log 2>&1 &
    - |
      ready=no
      for attempt in $(seq 1 30); do
        if node -e 'fetch(process.argv[1]).then((r) => process.exit(r.status === 503 ? 0 : 1), () => process.exit(1))' "$SYNTHETIC_HOST_URL/api/health?deep=1"; then
          ready=yes
          break
        fi
        sleep 1
      done
      if [ "$ready" != yes ]; then cat synthetic-host.log; exit 1; fi
    - cd e2e
    - npm ci --no-audit --no-fund
    - npx playwright test tests/synthetic-inquiry.spec.js
  after_script:
    - tail -n 50 synthetic-host.log || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - synthetic-host.log
      - e2e/playwright-report/
      - e2e/test-results/

# Builds the zip the Function App runs: the app files at the archive root plus
# BUILD_COMMIT, which /api/health reports as `commit`. A new Python module must
# be added to this list, or the published app fails to import it.
package:apply-proxy:
  extends: .apply-proxy:verify-rules
  stage: package
  interruptible: true
  image: ${PREFLIGHT_IMAGE}
  needs:
    - job: test:apply-proxy
      artifacts: false
  script:
    - cd infra/azure/apply-proxy
    - printf '%s\n' "$CI_COMMIT_SHA" > BUILD_COMMIT
    - python3 -I -m zipfile -c "$CI_PROJECT_DIR/apply-proxy.zip" function_app.py intake_notify.py deep_health.py managed_identity.py analytics.py intake_outcomes.py host.json requirements.txt index.html BUILD_COMMIT
    - python3 -I -m zipfile -l "$CI_PROJECT_DIR/apply-proxy.zip"
  artifacts:
    paths:
      - apply-proxy.zip
      # verify:analytics runs on the azure-deploy runner, which cannot clone
      # (GIT_STRATEGY none), so its script travels as an artifact.
      - infra/azure/analytics-verify.sh
    expire_in: 1 week

# Publishes the zip. The job runs on the scoped `azure-deploy` runner, which
# mounts the ESO-delivered certificate Secret (client-id, tenant-id, sp.pem);
# no GitLab CI variable holds a credential and the template refuses to run if
# one is set. AZURE_FUNCTION_SUBSCRIPTION_ID is a project CI/CD variable: it is
# an identifier, not a credential, and the template fails clearly without it.
deploy:apply-proxy:
  extends:
    - .deploy:azure-function
    - .apply-proxy:deploy-rules
  stage: deploy
  needs:
    - job: package:apply-proxy
      artifacts: true
    # A proxy that refuses a guest's real-form inquiry is never published (#85).
    - job: synthetic:inquiry
      artifacts: false
  variables:
    # The template pulls ${IMAGE_REGISTRY}/mcr-proxy/azure-cli.
    IMAGE_REGISTRY: "harbor.focuscell.org"
    AZURE_FUNCTION_APP: mtcottages-apply-proxy
    AZURE_FUNCTION_RESOURCE_GROUP: mtcottages
    AZURE_FUNCTION_ZIP: apply-proxy.zip
    # Linux Consumption Python app: Kudu installs requirements.txt on publish.
    AZURE_FUNCTION_ZIP_REMOTE_BUILD: "true"
    AZURE_FUNCTION_HEALTH_URL: https://stay.mtcottages.com/api/health
  environment:
    name: stay-application-host
    url: https://stay.mtcottages.com/

# The safe application-edge suite against the live host. It waits for
# /api/health to report this commit, loads the form and posts one honeypot
# probe that the proxy rejects with HTTP 400. It never submits a valid
# application. The marketing microsite checks in the same file stay with the
# GitHub Pages workflow.
smoke:apply-proxy:
  extends: .apply-proxy:deploy-rules
  stage: smoke
  # renovate: datasource=docker depName=playwright registryUrl=https://mcr.microsoft.com
  image: "harbor.focuscell.org/mcr-proxy/playwright:v1.62.1-noble"
  needs:
    - job: deploy:apply-proxy
      artifacts: false
  variables:
    BASE_URL: https://stay.mtcottages.com
    EXPECTED_COMMIT: $CI_COMMIT_SHA
  script:
    - cd e2e
    - npm ci
    # Xvfb (shipped in the Playwright image) gives the real-browser Turnstile
    # check (#85) a headed Chromium; the spec runs headless when DISPLAY is unset.
    # tests/live-turnstile.spec.js is its own file: its headed launch options are worker-scoped.
    - xvfb-run -a npx playwright test tests/live.spec.js tests/live-turnstile.spec.js --grep-invert microsite
  artifacts:
    when: on_failure
    paths:
      - e2e/playwright-report
    expire_in: 1 week

# #85 probe, by hand only: real Chromium takes production Turnstile tokens and
# posts each with an empty inquiry (token only), fresh, reused, held past the
# 300 s token lifetime and after a phone-style tab freeze, and prints how the
# live Function answers (stage and reason, `PROBE {...}` lines). An empty
# inquiry stops at verification or validation, so nothing reaches the Logic
# App and no valid application is ever submitted. Play it from a merge request
# pipeline, or run a gh-pages pipeline with TURNSTILE_PROBE=true.
probe:turnstile-age:
  stage: smoke
  # renovate: datasource=docker depName=playwright registryUrl=https://mcr.microsoft.com
  image: "harbor.focuscell.org/mcr-proxy/playwright:v1.62.1-noble"
  needs: []
  interruptible: true
  allow_failure: true
  timeout: 20m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $TURNSTILE_PROBE == "true"'
    - when: never
  variables:
    BASE_URL: https://stay.mtcottages.com
  script:
    - cd e2e
    - npm ci
    - xvfb-run -a npx playwright test tests/live-turnstile-age.spec.js
  artifacts:
    when: always
    paths:
      - e2e/playwright-report
    expire_in: 1 week

# Cookieless analytics (#23, docs/marketing/analytics-adr.md). smoke:apply-proxy
# opened the stay form in a webdriver browser labelled ci-<sha8> and typed into
# it (never submitting), so the collector stored a form_view and a form_start
# in the test partition. This job reads the staff dashboard (/api/stats) with
# the Function App's default function key and fails unless both are counted,
# which proves the beacon -> storage -> dashboard path end to end. The key is
# fetched with the deploy identity, kept in a 0600 file and never printed.
verify:analytics:
  extends: .apply-proxy:deploy-rules
  stage: smoke
  tags:
    - azure-deploy
  # renovate: datasource=docker depName=azure-cli registryUrl=https://mcr.microsoft.com
  image:
    name: harbor.focuscell.org/mcr-proxy/azure-cli:2.85.0
    entrypoint: [""]
  needs:
    - job: package:apply-proxy
      artifacts: true
    - job: smoke:apply-proxy
      artifacts: false
  interruptible: false
  timeout: 15m
  variables:
    ANALYTICS_TEST_LABEL: "ci-${CI_COMMIT_SHORT_SHA}"
    # Like the launch-sequence deploy template: the azure-deploy runner cannot
    # write a git config (HOME is /), so the job takes no checkout and runs the
    # script from package:apply-proxy's artifact. HOME also points at a
    # writable path, so nothing else in the job tries to write under /.
    # scripts/check-ci-runner-contract.py enforces both in MR pipelines.
    GIT_STRATEGY: none
    HOME: /tmp
  script:
    - bash infra/azure/analytics-verify.sh

# ---------------------------------------------------------------------------
# Intake Logic App (mtcottages/mtcottages-intake), WorldEnterpriseGroup/mtcottages#13
# ---------------------------------------------------------------------------
# infra/azure/mtcottages-intake.definition.json and .parameters.json are the
# source of truth. deploy:intake-logicapp PUTs them on a protected gh-pages push
# that changes them; drift:intake-logicapp runs on the nightly schedule and fails
# when live differs from git. Both sign in exactly like deploy:apply-proxy: the
# certificate service principal mounted by the scoped azure-deploy runner, never
# a CI variable. See infra/azure/README.md, "Intake Logic App from git".
#
# INTAKE_LOGICAPP_DEPLOY_ENABLED and INTAKE_LOGICAPP_DRIFT are switches, not
# credentials. They stay unset until the deploy identity holds Logic App
# Contributor on the workflow and may join its D365 connection, so no pipeline
# waits on a permission that is not there.
.intake-logicapp:paths: &intake_logicapp_paths
  - infra/azure/mtcottages-intake.definition.json
  - infra/azure/mtcottages-intake.parameters.json
  - infra/azure/intake-logicapp.sh
  - .gitlab-ci.yml

# The azure-deploy runner's pods cannot open a connection to
# git.developerdojo.org:443, so a checkout there fails in get_sources
# ("Failed to connect ... after 133 s", count:intake-loss jobs 2577588 and
# 2577608, #12). Artifact download goes through the runner and works, which is
# why deploy:apply-proxy and verify:analytics pass. The intake jobs take no
# checkout either; this job ships every file they read. Its rules are the union
# of theirs, so each of them always finds it in the pipeline.
package:intake-scripts:
  stage: package
  image: ${PREFLIGHT_IMAGE}
  needs: []
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $INTAKE_LOGICAPP_DEPLOY_ENABLED == "true" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: *intake_logicapp_paths
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/ && ($INTAKE_LOGICAPP_DRIFT == "true" || $INTAKE_CANARY_ENABLED == "true" || $INTAKE_LOSS_COUNT == "true")'
    - when: never
  script:
    - bash -n infra/azure/intake-logicapp.sh
    - bash -n infra/azure/intake-canary.sh
    - bash -n infra/azure/intake-loss-count.sh
    - jq empty infra/azure/mtcottages-intake.definition.json infra/azure/mtcottages-intake.parameters.json
  artifacts:
    paths:
      - infra/azure/intake-logicapp.sh
      - infra/azure/intake-canary.sh
      - infra/azure/intake-loss-count.sh
      - infra/azure/mtcottages-intake.definition.json
      - infra/azure/mtcottages-intake.parameters.json
    expire_in: 1 day

.intake-logicapp:azure:
  tags:
    - azure-deploy
  # renovate: datasource=docker depName=azure-cli registryUrl=https://mcr.microsoft.com
  image:
    name: harbor.focuscell.org/mcr-proxy/azure-cli:2.85.0
    entrypoint: [""]
  # One writer or reader of the workflow at a time, across pipelines.
  resource_group: logicapp-mtcottages-intake
  # No checkout: the azure-deploy runner cannot reach the GitLab host for a
  # clone (see package:intake-scripts) and its pod has HOME=/ (#23). Every job
  # below needs package:intake-scripts for its files; HOME points at a
  # writable path for az. scripts/check-ci-runner-contract.py enforces both.
  variables:
    GIT_STRATEGY: none
    HOME: /tmp
  interruptible: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  timeout: 15m

deploy:intake-logicapp:
  extends: .intake-logicapp:azure
  stage: deploy
  needs:
    - job: package:intake-scripts
      artifacts: true
  rules:
    # A hand-run read-only check never deploys the workflow it is reading.
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($INTAKE_LOSS_COUNT == "true" || $INTAKE_LOGICAPP_DRIFT == "true" || $INTAKE_CANARY_ENABLED == "true")'
      when: never
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $INTAKE_LOGICAPP_DEPLOY_ENABLED == "true" && $CI_PIPELINE_SOURCE != "schedule"'
      changes: *intake_logicapp_paths
    - when: never
  script:
    - bash infra/azure/intake-logicapp.sh deploy
  environment:
    name: intake-logic-app

drift:intake-logicapp:
  extends: .intake-logicapp:azure
  stage: smoke
  needs:
    - job: package:intake-scripts
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "schedule" && $INTAKE_LOGICAPP_DRIFT == "true"'
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $INTAKE_LOGICAPP_DRIFT == "true"'
    - when: never
  script:
    - bash infra/azure/intake-logicapp.sh drift

# End-to-end canary (#16): one synthetic inquiry through Front Door, the proxy,
# the Logic App and Dynamics 365, then proof the canary lead was deleted. A
# failure fails this scheduled pipeline (pipeline-failure email) and the Logic
# App's own RunsFailed alert fires. Off until the canary token, CANARY_TOKEN and
# CANARY_GUEST_EMAIL app settings and the runner identity's Key Vault and
# Logic App Operator roles exist (README, "End-to-end canary").
canary:intake:
  extends: .intake-logicapp:azure
  stage: smoke
  needs:
    - job: package:intake-scripts
      artifacts: true
  # The canary only reads the workflow; it must not queue behind a deploy.
  resource_group: intake-canary-mtcottages
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "schedule" && $INTAKE_CANARY_ENABLED == "true"'
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $INTAKE_CANARY_ENABLED == "true"'
    - when: never
  timeout: 10m
  script:
    - bash infra/azure/intake-canary.sh

# ---------------------------------------------------------------------------
# Growth roadmap (WorldEnterpriseGroup/mtcottages#11)
# ---------------------------------------------------------------------------
# Renders the open issues, ranked by RICE and grouped by growth epic, into one
# static HTML page kept as a job artifact. The newest render on main is always at
#   https://git.developerdojo.org/WorldEnterpriseGroup/mtcottages/-/jobs/artifacts/main/file/roadmap/index.html?job=roadmap
# A daily pipeline schedule on main refreshes it. Read-only: it only GETs the
# issues and epics APIs, with ROADMAP_API_TOKEN (a read_api project access
# token, masked). See docs/marketing/roadmap.md.

.roadmap:image: &roadmap_image "harbor.focuscell.org/dockerhub-proxy/library/python:3.14-slim"

roadmap:test:
  stage: preflight
  interruptible: true
  image: *roadmap_image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - scripts/roadmap/**/*
          - .gitlab-ci.yml
  script:
    - python3 -m unittest discover -s scripts/roadmap -v
    - python3 -I scripts/roadmap/render_roadmap.py --issues scripts/roadmap/fixtures/issues.json --epics scripts/roadmap/fixtures/epics.json --out roadmap/index.html
  artifacts:
    paths:
      - roadmap/
    expire_in: 1 week

roadmap:
  stage: report
  interruptible: true
  image: *roadmap_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web|api|trigger)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ROADMAP_API_TOKEN'
      changes:
        paths:
          - scripts/roadmap/**/*
          - .gitlab-ci.yml
  script:
    - python3 -I scripts/roadmap/render_roadmap.py --out roadmap/index.html --min-issues 1
  artifacts:
    expose_as: "growth roadmap"
    paths:
      - roadmap/
    expire_in: 90 days

# Lost-inquiry count (#12): read-only, aggregates only (Front Door POST
# /api/apply attempts per day and status, Logic App runs per day and status).
# Run by hand: "Run pipeline" on gh-pages (UI, or `glab ci run`, which GitLab
# reports as source "api") with INTAKE_LOSS_COUNT=true, and
# optionally INTAKE_LOSS_SINCE=YYYY-MM-DD (default 2026-07-01).
count:intake-loss:
  extends: .intake-logicapp:azure
  stage: smoke
  needs:
    - job: package:intake-scripts
      artifacts: true
  resource_group: intake-loss-count-mtcottages
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $INTAKE_LOSS_COUNT == "true"'
    - when: never
  timeout: 10m
  script:
    - bash infra/azure/intake-loss-count.sh
