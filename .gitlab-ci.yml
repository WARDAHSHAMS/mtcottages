# mtcottages — gh-pages mirror to GitHub
#
# gh-pages is the published branch: GitHub Pages (via GitHub Actions,
# .github/workflows/ci-cd.yml) serves it directly. This pipeline's only
# job is to push gh-pages to the GitHub mirror so that workflow can run.
#
# The full launch-sequence pipeline (lint/preflight + GitLab Pages deploy)
# lives on the demo branch instead — gh-pages only needs the mirror job,
# so we include just that job file rather than the whole static-site
# pipeline.
#
# main (the default branch) and merge requests get one light validation job,
# `validate`, so the default branch has a pipeline. Without it, every job in
# this file is gated on `$CI_COMMIT_BRANCH == "gh-pages"`, so a push to main
# created zero jobs and therefore no pipeline. validate is read-only: it builds
# nothing, deploys nothing and never runs on gh-pages, so the mirror job above
# is unchanged.
#
# The stay application host (infra/azure/apply-proxy, the Azure Function behind
# stay.mtcottages.com) is published by this pipeline and by nothing else
# (WorldEnterpriseGroup/mtcottages#9). test:apply-proxy and package:apply-proxy
# run on merge requests and on gh-pages; deploy:apply-proxy and
# smoke:apply-proxy run on gh-pages only. See infra/azure/README.md.

include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: 327c2283a8f056624e979c135de1408d465e680c
    file: '/jobs/github-mirror.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: 327c2283a8f056624e979c135de1408d465e680c
    file: '/jobs/preflight.yml'
  # Pinned separately: the two includes above predate this job file.
  - project: 'DroidOpsInc/launch-sequence'
    ref: 9668a18a9ec16f8238fafe14153d510cc9ef5b76
    file: '/jobs/deploy-azure-function.yml'

variables:
  GITHUB_REPO: "WorldEnterpriseGroup/mtcottages"
  # launch-sequence's mirror job fails closed without a GITHUB_TOKEN. This project defines
  # none (the previous template skipped silently), so keep "push nothing" explicit.
  GITHUB_MIRROR_EXTERNAL: "true"
  PREFLIGHT_IMAGE: "harbor.focuscell.org/dockerhub-proxy/alpine/k8s:1.33.1"
  PREFLIGHT_REQUIRED_TOOLS: "jq python3"
  # The "Before publishing" checks from CLAUDE.md that need no npm install.
  PREFLIGHT_COMMANDS: |
    python3 -I scripts/check-form-parity.py
    jq empty infra/azure/*.json
    test -f .nojekyll
    grep -qx 'mtcottages.com' CNAME

stages:
  - preflight
  - mirror
  - package
  - deploy
  - smoke
  - report

mirror:
  extends: .mirror:github

validate:
  extends: .preflight:lint

# ---------------------------------------------------------------------------
# Stay application host (infra/azure/apply-proxy)
# ---------------------------------------------------------------------------

# When the apply-proxy jobs run. A pipeline started by hand ("Run pipeline" on
# gh-pages) has no push to compare against, so `changes` is true and the current
# commit is published again.
.apply-proxy:paths: &apply_proxy_paths
  - infra/azure/apply-proxy/**/*
  - .gitlab-ci.yml

.apply-proxy:verify-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *apply_proxy_paths
    - if: '$CI_COMMIT_BRANCH == "gh-pages"'
      changes: *apply_proxy_paths

# APPLY_PROXY_DEPLOY_ENABLED is a switch, not a credential. It stays unset until
# the deploy identity, its ExternalSecret and the scoped runner mount exist
# (infra/azure/README.md, "Prerequisites"). With it unset the deploy and smoke
# jobs are not created, so a pipeline never waits on a runner that is not there.
.apply-proxy:deploy-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "gh-pages" && $CI_COMMIT_REF_PROTECTED == "true" && $APPLY_PROXY_DEPLOY_ENABLED == "true"'
      changes: *apply_proxy_paths
    - when: never

test:apply-proxy:
  extends: .apply-proxy:verify-rules
  stage: preflight
  interruptible: true
  # renovate: datasource=docker depName=python
  image: "harbor.focuscell.org/dockerhub-proxy/library/python:3.14-slim"
  script:
    - python3 -m pip install --disable-pip-version-check --no-input --quiet "pytest>=8,<9"
    - python3 -m py_compile infra/azure/apply-proxy/function_app.py
    - python3 -m pytest -q infra/azure/apply-proxy/tests

# Builds the zip the Function App runs: the four app files at the archive root
# plus BUILD_COMMIT, which /api/health reports as `commit`.
package:apply-proxy:
  extends: .apply-proxy:verify-rules
  stage: package
  interruptible: true
  image: ${PREFLIGHT_IMAGE}
  needs:
    - job: test:apply-proxy
      artifacts: false
  script:
    - cd infra/azure/apply-proxy
    - printf '%s\n' "$CI_COMMIT_SHA" > BUILD_COMMIT
    - python3 -I -m zipfile -c "$CI_PROJECT_DIR/apply-proxy.zip" function_app.py host.json requirements.txt index.html BUILD_COMMIT
    - python3 -I -m zipfile -l "$CI_PROJECT_DIR/apply-proxy.zip"
  artifacts:
    paths:
      - apply-proxy.zip
    expire_in: 1 week

# Publishes the zip. The job runs on the scoped `azure-deploy` runner, which
# mounts the ESO-delivered certificate Secret (client-id, tenant-id, sp.pem);
# no GitLab CI variable holds a credential and the template refuses to run if
# one is set. AZURE_FUNCTION_SUBSCRIPTION_ID is a project CI/CD variable: it is
# an identifier, not a credential, and the template fails clearly without it.
deploy:apply-proxy:
  extends:
    - .deploy:azure-function
    - .apply-proxy:deploy-rules
  stage: deploy
  needs:
    - job: package:apply-proxy
      artifacts: true
  variables:
    # The template pulls ${IMAGE_REGISTRY}/mcr-proxy/azure-cli.
    IMAGE_REGISTRY: "harbor.focuscell.org"
    AZURE_FUNCTION_APP: mtcottages-apply-proxy
    AZURE_FUNCTION_RESOURCE_GROUP: mtcottages
    AZURE_FUNCTION_ZIP: apply-proxy.zip
    # Linux Consumption Python app: Kudu installs requirements.txt on publish.
    AZURE_FUNCTION_ZIP_REMOTE_BUILD: "true"
    AZURE_FUNCTION_HEALTH_URL: https://stay.mtcottages.com/api/health
  environment:
    name: stay-application-host
    url: https://stay.mtcottages.com/

# The safe application-edge suite against the live host. It waits for
# /api/health to report this commit, loads the form and posts one honeypot
# probe that the proxy rejects with HTTP 400. It never submits a valid
# application. The marketing microsite checks in the same file stay with the
# GitHub Pages workflow.
smoke:apply-proxy:
  extends: .apply-proxy:deploy-rules
  stage: smoke
  # renovate: datasource=docker depName=playwright registryUrl=https://mcr.microsoft.com
  image: "harbor.focuscell.org/mcr-proxy/playwright:v1.62.1-noble"
  needs:
    - job: deploy:apply-proxy
      artifacts: false
  variables:
    BASE_URL: https://stay.mtcottages.com
    EXPECTED_COMMIT: $CI_COMMIT_SHA
  script:
    - cd e2e
    - npm ci
    - npx playwright test tests/live.spec.js --grep-invert microsite
  artifacts:
    when: on_failure
    paths:
      - e2e/playwright-report
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Growth roadmap (WorldEnterpriseGroup/mtcottages#11)
# ---------------------------------------------------------------------------
# Renders the open issues, ranked by RICE and grouped by growth epic, into one
# static HTML page kept as a job artifact. The newest render on main is always at
#   https://git.developerdojo.org/WorldEnterpriseGroup/mtcottages/-/jobs/artifacts/main/file/roadmap/index.html?job=roadmap
# A daily pipeline schedule on main refreshes it. Read-only: it only GETs the
# issues and epics APIs, with ROADMAP_API_TOKEN (a read_api project access
# token, masked). See docs/marketing/roadmap.md.

.roadmap:image: &roadmap_image "harbor.focuscell.org/dockerhub-proxy/library/python:3.14-slim"

roadmap:test:
  stage: preflight
  interruptible: true
  image: *roadmap_image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths:
          - scripts/roadmap/**/*
          - .gitlab-ci.yml
  script:
    - python3 -m unittest discover -s scripts/roadmap -v
    - python3 -I scripts/roadmap/render_roadmap.py --issues scripts/roadmap/fixtures/issues.json --epics scripts/roadmap/fixtures/epics.json --out roadmap/index.html
  artifacts:
    paths:
      - roadmap/
    expire_in: 1 week

roadmap:
  stage: report
  interruptible: true
  image: *roadmap_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE =~ /^(push|schedule|web|api|trigger)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ROADMAP_API_TOKEN'
      changes:
        paths:
          - scripts/roadmap/**/*
          - .gitlab-ci.yml
  script:
    - python3 -I scripts/roadmap/render_roadmap.py --out roadmap/index.html --min-issues 1
  artifacts:
    expose_as: "growth roadmap"
    paths:
      - roadmap/
    expire_in: 90 days
